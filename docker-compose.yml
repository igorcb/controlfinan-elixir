services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: controlfinan_elixir
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: .
    environment:
      DATABASE_URL: ecto://app:app@db:5432/controlfinan_elixir
      TEST_DATABASE_URL: ecto://app:app@db:5432/controlfinan_elixir_test
      SECRET_KEY_BASE: development-only-secret
      BCRYPT_COST: 12
    ports:
      - "8009:8000"
    volumes:
      - .:/app
      - hex_cache:/home/app/.hex
    depends_on:
      - db

volumes:
  db_data:
  hex_cache:
